name: SAST & Secrets Detection

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  schedule:
    - cron: "0 2 * * 3"

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  bandit:
    name: Bandit SAST
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Bandit
        run: pip install bandit[sarif]==1.7.8

      - name: Run Bandit
        run: |
          bandit \
            -r math_proof_assistant.py \
            -f sarif \
            -o bandit-results.sarif \
            -ll \
            --skip B101,B311 \
            --confidence-level medium
        continue-on-error: true

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      - name: Bandit JSON report for annotations
        run: |
          bandit \
            -r math_proof_assistant.py \
            -f json \
            -o bandit-results.json \
            -ll \
            --skip B101,B311 \
            --confidence-level medium || true

      - name: Annotate PR with Bandit findings
        if: github.event_name == 'pull_request'
        run: |
          python - <<'EOF'
          import json, sys, os
          try:
              with open("bandit-results.json") as f:
                  data = json.load(f)
          except Exception:
              sys.exit(0)
          results = data.get("results", [])
          high = [r for r in results if r.get("issue_severity") == "HIGH"]
          if high:
              for r in high:
                  print(f"::error file={r['filename']},line={r['line_number']}::{r['issue_text']} [{r['test_id']}]")
              sys.exit(1)
          EOF

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Semgrep — Python security ruleset
        run: |
          semgrep \
            --config "p/python" \
            --config "p/secrets" \
            --config "p/owasp-top-ten" \
            --config "p/supply-chain" \
            --sarif \
            --output semgrep-results.sarif \
            --severity ERROR \
            --severity WARNING \
            math_proof_assistant.py
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

  gitleaks:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout — full history for secrets scan
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  trufflehog:
    name: Secret Detection (TruffleHog)
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: >-
            --only-verified
            --concurrency=4
            --max-depth=50

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality,security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-${{ matrix.language }}
          upload: true
